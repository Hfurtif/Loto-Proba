name: Build Loto-Proba APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # --- Branche Flutter (si pubspec.yaml est présent dans le dépôt) ---
      - name: Set up Flutter
        if: hashFiles('pubspec.yaml') != ''
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter dependencies
        if: hashFiles('pubspec.yaml') != ''
        run: flutter pub get

      - name: Build Flutter Release APK
        if: hashFiles('pubspec.yaml') != ''
        run: flutter build apk --release

      - name: Upload Flutter APK artifact
        if: hashFiles('pubspec.yaml') != ''
        uses: actions/upload-artifact@v4
        with:
          name: Loto-Proba-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      # --- Branche Android natif Kotlin / Gradle (dépôt actuel sans pubspec.yaml) ---
      - name: Set up Android SDK
        if: hashFiles('pubspec.yaml') == ''
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        if: hashFiles('pubspec.yaml') == ''
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare debug keystore
        if: hashFiles('pubspec.yaml') == ''
        run: |
          if [ -f debug.keystore.base64 ] && [ ! -f debug.keystore ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Android Debug APK (Kotlin/Gradle)
        if: hashFiles('pubspec.yaml') == ''
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload Android APK artifact
        if: hashFiles('pubspec.yaml') == ''
        uses: actions/upload-artifact@v4
        with:
          name: Loto-Proba-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
